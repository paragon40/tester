name: Tester Workflows

on:
  push: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_ROLE_ARN: arn:aws:iam::259183055744:role/tester-github-oidc
  AWS_REGION: us-east-1

jobs:
  tester:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      #- name: Install Terraform
      #  uses: hashicorp/setup-terraform@v3

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Test Bucket Listing
        run: |
          aws s3api list-objects-v2 \
            --bucket tester-bucket-tester \
            --max-items 5

      - name: Test Bucket Creation
        run: aws s3api create-bucket --bucket another-test-bucket --region ${{ env.AWS_REGION }}

      - name: Final Result S
        if: success()
        run: echo "This is working"

      - name: Final Result F
        if: failure()
        run: echo "This is Failing"
